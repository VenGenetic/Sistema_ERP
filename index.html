<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <script>
    // MutationObserver to prevent browser translation tools from breaking Material Symbols icons
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === 1) { // Node.ELEMENT_NODE
            if (node.classList.contains('material-symbols-outlined')) {
              node.setAttribute('translate', 'no');
              node.classList.add('notranslate');
            }
            const children = node.getElementsByClassName('material-symbols-outlined');
            for (let i = 0; i < children.length; i++) {
              children[i].setAttribute('translate', 'no');
              children[i].classList.add('notranslate');
            }
          }
        }
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>

  <!--
    Theme bootstrap. Runs before first paint to avoid a flash of the wrong theme.
    Base theme is LIGHT; 'dark' is opt-in and persisted in localStorage under 'theme'.
    Toggle at runtime with the helpers in utils/theme.ts.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var useDark = stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', useDark);
      } catch (e) { /* localStorage blocked — stay on light */ }
    })();
  </script>

  <!--
    ============================================================================
    DESIGN TOKENS  (single source of truth)
    ============================================================================
    Every colour is declared once here as an "R G B" triplet and consumed by the
    Tailwind config below as rgb(var(--token) / <alpha-value>). That means:

      * one definition per role, not per theme-per-component;
      * `bg-surface` / `text-muted` / `border-subtle` flip automatically when the
        `dark` class lands on <html> — no `dark:` variant needed at call sites;
      * opacity modifiers still work (`bg-primary/10`, `border-subtle/50`).

    Legacy token names (primary, surface-dark, border-dark, text-secondary, …)
    are kept and re-pointed at these same variables so the ~170 call sites that
    already use them become theme-aware for free.
    ========================================================================= -->
  <style>
    :root {
      /* ---------------------------------------------------------------
         PALETA SERENA
         Los acentos están desaturados a ~40-45% de croma (antes 72-94%).
         La serenidad se consigue bajando el CROMA, nunca el contraste de
         luminancia: por eso todos los pares siguen cumpliendo WCAG AA.
         Verificar con `npm run check-contrast` tras cualquier cambio.
         --------------------------------------------------------------- */

      /* Superficies — gris neutro frío, croma casi nulo.
         Los escalones son AMPLIOS a propósito: si el fondo de página y la
         tarjeta se diferencian en un 3%, los apartados no se separan y todo
         se lee como una sola lámina. El fondo es claramente gris para que
         las superficies blancas se despeguen por sí solas, sin depender de
         sombras fuertes (que romperían la serenidad). */
      --bg: 236 239 244;
      /* fondo de página — gris definido           */
      --surface: 255 255 255;
      /* tarjetas, tablas, modales — blanco puro   */
      --surface-2: 246 248 251;
      /* cabecera de tabla / pozo DENTRO de una tarjeta */
      --surface-3: 226 231 239;
      /* inset / deshabilitado                     */
      --surface-hover: 241 244 249;
      /* hover de fila y de navegación             */

      /* Bordes */
      --border: 216 222 231;
      /* hairline — algo más marcado, define el canto de cada apartado */
      --border-strong: 134 143 161;
      /* borde de input          3.3:1  croma 13% */

      /* Texto — 3 niveles bastan para una interfaz densa */
      --fg: 27 36 54;
      /* títulos, totales       15.7:1 (negro suavizado, no #000) */
      --fg-muted: 98 109 128;
      /* dato secundario         5.0:1 */
      --fg-subtle: 131 142 159;
      /* placeholders, pistas    3.2:1 */

      /* Acentos funcionales — un tono por significado, nunca decorativo.
         Cada color trae su `-fg`: el texto que va ENCIMA del color.
         En claro los acentos son oscuros, así que su `-fg` es blanco. */
      --primary: 60 107 160;
      /* azul acero              5.1:1  croma 45% */
      --primary-hover: 50 90 135;
      --primary-fg: 255 255 255;
      --primary-soft: 237 242 248;
      --primary-soft-fg: 47 85 128;
      /* 6.6:1 */

      --success: 59 115 85;
      /* verde salvia            4.8:1 sobre página  croma 32% */
      --success-fg: 255 255 255;
      --success-soft: 237 245 241;
      --success-soft-fg: 53 102 78;
      /* 5.8:1 */

      --warning: 128 102 54;
      /* ocre apagado            4.7:1 sobre página  croma 41% */
      --warning-fg: 255 255 255;
      --warning-soft: 250 244 232;
      --warning-soft-fg: 111 89 48;
      /* 5.9:1 */

      --danger: 168 68 63;
      /* teja apagada            5.5:1  croma 45% */
      --danger-hover: 142 57 52;
      --danger-fg: 255 255 255;
      --danger-soft: 250 238 237;
      --danger-soft-fg: 142 57 52;
      /* 7.0:1 */

      --ring: 60 107 160;
      /* anillo de foco = primario */

      /* Tinte de elevación (las sombras van teñidas, nunca negro puro) */
      --shadow-color: 27 36 54;

      /* ---------------------------------------------------------------
         WHATSAPP — la paleta REAL de WhatsApp, y solo para el chat
         ---------------------------------------------------------------
         La bandeja y el modo movil imitan a WhatsApp a proposito: el
         vendedor pasa el dia dentro del WhatsApp del telefono, y la
         bandeja tiene que leerse IGUAL -- misma burbuja verde a la
         derecha, mismos checks, mismo papel tapiz -- para no tener que
         traducir nada en la cabeza al saltar de una pantalla a la otra.

         Son los valores exactos de WhatsApp Web, asi que NO siguen la
         paleta serena del resto del ERP. Por eso viven en su propio
         prefijo `--wa-*`: ningun token del sistema queda tocado y las
         otras 22 pantallas no se enteran. */
      --wa-bg: 239 234 226;
      /* #efeae2 papel tapiz del hilo            */
      --wa-panel: 255 255 255;
      /* #ffffff lista de chats                  */
      --wa-header: 240 242 245;
      /* #f0f2f5 cabecera y caja de escribir     */
      --wa-in: 255 255 255;
      /* #ffffff burbuja del cliente             */
      --wa-out: 217 253 211;
      /* #d9fdd3 burbuja propia                  */
      --wa-text: 17 27 33;
      /* #111b21 texto dentro de la burbuja      */
      --wa-meta: 102 119 129;
      /* #667781 hora sobre la burbuja blanca    */
      --wa-meta-out: 84 101 111;
      /* #54656f hora sobre la verde       4.6:1 */
      --wa-divider: 233 237 239;
      /* #e9edef hairline de la lista            */
      --wa-hover: 245 246 246;
      --wa-active: 240 242 245;
      --wa-input: 255 255 255;
      --wa-pill: 255 255 255;
      /* pildora de fecha y avisos del sistema   */
      --wa-pill-text: 84 101 111;
      --wa-notice: 255 238 205;
      /* #ffeecd el aviso amarillo de arriba     */
      --wa-notice-text: 84 101 111;
      --wa-accent: 0 168 132;
      /* #00a884 el verde de WhatsApp            */
      --wa-accent-strong: 0 128 105;
      /* #008069 verde de boton (icono blanco encima: 4.2:1, AA no-texto) */
      --wa-accent-fg: 255 255 255;
      --wa-tick: 83 189 235;
      /* #53bdeb el doble check azul de "visto"  */
    }

    .dark {
      /* Oscuro sereno: superficies con azul apagado en vez de negro puro.
         Los escalones entre --bg / --surface / --surface-2 son cortos a
         propósito, para que la jerarquía se lea sin bordes duros. */
      --bg: 18 22 31;
      --surface: 26 31 43;
      --surface-2: 31 37 50;
      --surface-3: 38 45 60;
      --surface-hover: 36 43 57;

      --border: 46 55 70;
      --border-strong: 104 115 141;
      /* 3.5:1 sobre superficie — identifica el borde de los inputs */

      --fg: 232 235 240;
      /* blanco suavizado: el blanco puro sobre fondo oscuro deslumbra
         y cansa la vista en jornadas largas de mostrador */
      --fg-muted: 154 164 181;
      --fg-subtle: 110 120 137;

      /* En oscuro los acentos son CLAROS, así que el texto que va encima
         es tinta oscura, no blanco. Por eso cada `-fg` se invierte aquí:
         blanco sobre un ocre claro daría 2.2:1 (ilegible). */
      --primary: 124 163 212;
      /* azul acero claro    7.0:1  croma 51% */
      --primary-hover: 153 184 224;
      --primary-fg: 16 22 32;
      --primary-soft: 35 54 79;
      --primary-soft-fg: 184 208 234;

      --success: 111 175 141;
      /* salvia claro        7.4:1  croma 29% */
      --success-fg: 16 22 32;
      --success-soft: 30 58 46;
      --success-soft-fg: 169 214 190;

      --warning: 194 159 108;
      /* ocre claro          6.6:1  croma 41% */
      --warning-fg: 16 22 32;
      --warning-soft: 61 48 22;
      --warning-soft-fg: 232 206 150;

      --danger: 217 128 121;
      /* teja clara          5.7:1  croma 56% */
      --danger-hover: 229 154 148;
      --danger-fg: 16 22 32;
      --danger-soft: 69 33 31;
      --danger-soft-fg: 239 184 179;

      --ring: 124 163 212;
      --shadow-color: 0 0 0;

      /* WhatsApp oscuro — ver la nota en :root */
      --wa-bg: 11 20 26;
      /* #0b141a */
      --wa-panel: 17 27 33;
      /* #111b21 */
      --wa-header: 32 44 51;
      /* #202c33 */
      --wa-in: 32 44 51;
      /* #202c33 */
      --wa-out: 0 92 75;
      /* #005c4b */
      --wa-text: 233 237 239;
      /* #e9edef */
      --wa-meta: 134 150 160;
      /* #8696a0 */
      --wa-meta-out: 168 197 187;
      /* #a8c5bb sobre el verde oscuro     4.6:1 */
      --wa-divider: 34 45 52;
      --wa-hover: 32 44 51;
      --wa-active: 42 57 66;
      --wa-input: 42 57 66;
      /* #2a3942 */
      --wa-pill: 24 34 41;
      /* #182229 */
      --wa-pill-text: 134 150 160;
      --wa-notice: 24 34 41;
      --wa-notice-text: 255 216 148;
      --wa-accent: 0 168 132;
      --wa-accent-strong: 0 168 132;
      --wa-accent-fg: 17 27 33;
      --wa-tick: 83 189 235;
    }

    /* =========================================================================
       .on-paper — DOCUMENTOS QUE SE IMPRIMEN O SE EXPORTAN COMO IMAGEN
       =========================================================================
       Los tokens de arriba se invierten con el tema: en oscuro `--fg` es casi
       blanco (232 235 240). Eso es correcto para la interfaz, pero un documento
       que SIEMPRE se dibuja sobre papel blanco —la proforma que se captura con
       html2canvas y se envía al cliente— salía con la tinta casi blanca sobre
       blanco: las descripciones de los repuestos quedaban ilegibles.

       Esta clase vuelve a declarar la paleta CLARA dentro de su subárbol, así
       que `text-fg`, `bg-success-soft`, `border-subtle`… resuelven a tinta
       oscura sin importar el tema que tenga puesto el usuario. Se aplica al
       contenedor capturado, no al modal que lo rodea (ese sí sigue el tema).

       Al añadir un token nuevo arriba, añádelo también aquí.
       ====================================================================== */
    .on-paper {
      --bg: 236 239 244;
      --surface: 255 255 255;
      --surface-2: 246 248 251;
      --surface-3: 226 231 239;
      --surface-hover: 241 244 249;

      --border: 216 222 231;
      --border-strong: 134 143 161;

      --fg: 27 36 54;
      --fg-muted: 98 109 128;
      --fg-subtle: 131 142 159;

      --primary: 60 107 160;
      --primary-hover: 50 90 135;
      --primary-fg: 255 255 255;
      --primary-soft: 237 242 248;
      --primary-soft-fg: 47 85 128;

      --success: 59 115 85;
      --success-fg: 255 255 255;
      --success-soft: 237 245 241;
      --success-soft-fg: 53 102 78;

      --warning: 128 102 54;
      --warning-fg: 255 255 255;
      --warning-soft: 250 244 232;
      --warning-soft-fg: 111 89 48;

      --danger: 168 68 63;
      --danger-hover: 142 57 52;
      --danger-fg: 255 255 255;
      --danger-soft: 250 238 237;
      --danger-soft-fg: 142 57 52;

      --ring: 60 107 160;
      --shadow-color: 27 36 54;
    }

    /* =========================================================================
       CHAT DE WHATSAPP
       =========================================================================
       Lo unico del chat que no se puede escribir con utilidades de Tailwind: el
       papel tapiz en mosaico y la colita de la burbuja. Todo lo demas sale de
       los tokens --wa-* de arriba.
       ====================================================================== */

    /* Papel tapiz del hilo. WhatsApp usa garabatos; estos son de repuestos de
       moto -- corona, bujia, piston, disco de freno, llanta -- con el mismo
       gesto: trazo fino, muy tenue y en mosaico. Va como data-URI para no
       pedir un archivo mas al abrir cada chat. */
    .wa-wallpaper {
      background-color: rgb(var(--wa-bg));
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'260'%20height%3D'270'%20viewBox%3D'0%200%20260%20270'%3E%3Cg%20fill%3D'none'%20stroke%3D'%23111b21'%20stroke-width%3D'1.5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%20opacity%3D'.055'%3E%3Cg%20transform%3D'translate(34%2C32)'%3E%3Ccircle%20r%3D'11'%2F%3E%3Ccircle%20r%3D'4'%2F%3E%3Cpath%20d%3D'M0-15v3M0%2012v3M-15%200h3M12%200h3M-10.6-10.6l2.1%202.1M8.5%208.5l2.1%202.1M10.6-10.6l-2.1%202.1M-8.5%208.5l-2.1%202.1'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(112%2C28)%20rotate(-30)'%3E%3Cpath%20d%3D'M-16-4.5a5%205%200%200%200%200%209h6v-9z'%2F%3E%3Cpath%20d%3D'M-10-2.5h24a2.5%202.5%200%200%201%200%205h-24z'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(186%2C34)'%3E%3Crect%20x%3D'-3'%20y%3D'-15'%20width%3D'6'%20height%3D'9'%20rx%3D'2'%2F%3E%3Cpath%20d%3D'M-5-6h10l-1.5%206h-7z'%2F%3E%3Crect%20x%3D'-3.5'%20y%3D'0'%20width%3D'7'%20height%3D'7'%20rx%3D'1'%2F%3E%3Cpath%20d%3D'M0%207v6'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(56%2C96)'%3E%3Ccircle%20cx%3D'-9'%20r%3D'4.5'%2F%3E%3Ccircle%20cx%3D'9'%20r%3D'4.5'%2F%3E%3Cpath%20d%3D'M-9-4.5h18M-9%204.5h18'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(140%2C92)'%3E%3Cpath%20d%3D'M0-12l10.4%206v12L0%2012l-10.4-6v-12z'%2F%3E%3Ccircle%20r%3D'5'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(212%2C100)'%3E%3Ccircle%20r%3D'13'%2F%3E%3Ccircle%20r%3D'4.5'%2F%3E%3Ccircle%20cy%3D'-8.5'%20r%3D'1.3'%2F%3E%3Ccircle%20cx%3D'7.4'%20cy%3D'4.2'%20r%3D'1.3'%2F%3E%3Ccircle%20cx%3D'-7.4'%20cy%3D'4.2'%20r%3D'1.3'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(30%2C166)'%3E%3Crect%20x%3D'-7'%20y%3D'-14'%20width%3D'14'%20height%3D'11'%20rx%3D'2'%2F%3E%3Cpath%20d%3D'M-7-10.5h14M-7-7h14'%2F%3E%3Cpath%20d%3D'M0-3v6l-5%207h10z'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(100%2C170)'%3E%3Cpath%20d%3D'M-12%206a12%2012%200%201%201%2024%200'%2F%3E%3Cpath%20d%3D'M0%206l7.5-7.5'%2F%3E%3Ccircle%20r%3D'2'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(176%2C174)'%3E%3Ccircle%20r%3D'13'%2F%3E%3Ccircle%20r%3D'6'%2F%3E%3Cpath%20d%3D'M0-13v-3M0%2013v3M-13%200h-3M13%200h3'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(60%2C232)'%3E%3Cellipse%20cy%3D'-6'%20rx%3D'7.5'%20ry%3D'5.5'%2F%3E%3Cpath%20d%3D'M0-0.5v6l-5%205'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(134%2C236)'%3E%3Crect%20x%3D'-7'%20y%3D'-11'%20width%3D'14'%20height%3D'21'%20rx%3D'3'%2F%3E%3Cpath%20d%3D'M-7-5h14'%2F%3E%3Ccircle%20cy%3D'2.5'%20r%3D'3'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(206%2C238)'%3E%3Cpath%20d%3D'M-15%200h30M-15%200v6M15%200v6'%2F%3E%3Cpath%20d%3D'M-6%200c0-4%2012-4%2012%200'%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");
      background-repeat: repeat;
      background-size: 260px 270px;
      background-attachment: local;
    }

    /* El chat del MODO MÓVIL va siempre en la paleta oscura de WhatsApp,
       tenga el ERP el tema que tenga: el resto de esa pantalla (la barra de
       abajo, las tarjetas) es oscura y fija, así que un chat claro adentro
       se veía como un recorte pegado de otra aplicación. */
    .wa-dark {
      --wa-bg: 11 20 26;
      --wa-panel: 17 27 33;
      --wa-header: 32 44 51;
      --wa-in: 32 44 51;
      --wa-out: 0 92 75;
      --wa-text: 233 237 239;
      --wa-meta: 134 150 160;
      --wa-meta-out: 168 197 187;
      --wa-divider: 34 45 52;
      --wa-hover: 32 44 51;
      --wa-active: 42 57 66;
      --wa-input: 42 57 66;
      --wa-pill: 24 34 41;
      --wa-pill-text: 134 150 160;
      --wa-notice: 24 34 41;
      --wa-notice-text: 255 216 148;
      --wa-accent: 0 168 132;
      --wa-accent-strong: 0 168 132;
      --wa-accent-fg: 17 27 33;
      --wa-tick: 83 189 235;
    }

    .dark .wa-wallpaper,
    .wa-dark .wa-wallpaper {

    }

    /* La colita de la burbuja: un triangulo hecho con bordes, no con clip-path.
       Se ve igual, funciona en cualquier navegador y no cuesta una imagen. Solo
       la lleva la PRIMERA burbuja de cada grupo, como en WhatsApp: las que
       siguen se pegan sin pico. */
    .wa-tail-in::before,
    .wa-tail-out::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-bottom: 13px solid transparent;
    }

    .wa-tail-in::before {
      left: -8px;
      border-right: 9px solid rgb(var(--wa-in));
    }

    .wa-tail-out::before {
      right: -8px;
      border-left: 9px solid rgb(var(--wa-out));
    }

    /* Barra de desplazamiento del hilo: la de WhatsApp es un hilito que casi no
       se nota. Sin esto la barra gris del sistema parte el papel tapiz. */
    .wa-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .wa-scroll::-webkit-scrollbar-track { background: transparent; }
    .wa-scroll::-webkit-scrollbar-thumb {
      background: rgb(var(--wa-meta) / .35);
      border-radius: 999px;
    }
    .wa-scroll::-webkit-scrollbar-thumb:hover { background: rgb(var(--wa-meta) / .6); }
    .wa-scroll { scrollbar-width: thin; scrollbar-color: rgb(var(--wa-meta) / .35) transparent; }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        /*
          Radius scale. The previous config flattened lg/xl/2xl/3xl to 4px, which
          silently squared off 966 existing `rounded-*` classes. These values
          restore a proportional scale, so the markup that already asks for
          `rounded-lg` / `rounded-xl` now renders as intended.
        */
        borderRadius: {
          'none': '0px',
          'sm': '0.25rem',   /* 4px  — badges, chips, inline tags   */
          'DEFAULT': '0.375rem', /* 6px  — inputs, small buttons        */
          'md': '0.375rem',  /* 6px                                 */
          'lg': '0.5rem',    /* 8px  — buttons, nav items           */
          'xl': '0.625rem',  /* 10px — cards, panels                */
          '2xl': '0.875rem', /* 14px — modals, KPI cards            */
          '3xl': '1.25rem',  /* 20px — hero surfaces                */
          'full': '9999px',
        },
        extend: {
          colors: {
            /* ---- semantic (preferred going forward) ---- */
            bg: 'rgb(var(--bg) / <alpha-value>)',
            surface: {
              DEFAULT: 'rgb(var(--surface) / <alpha-value>)',
              2: 'rgb(var(--surface-2) / <alpha-value>)',
              3: 'rgb(var(--surface-3) / <alpha-value>)',
              hover: 'rgb(var(--surface-hover) / <alpha-value>)',
            },
            subtle: 'rgb(var(--border) / <alpha-value>)',
            strong: 'rgb(var(--border-strong) / <alpha-value>)',
            fg: {
              DEFAULT: 'rgb(var(--fg) / <alpha-value>)',
              muted: 'rgb(var(--fg-muted) / <alpha-value>)',
              subtle: 'rgb(var(--fg-subtle) / <alpha-value>)',
            },
            primary: {
              DEFAULT: 'rgb(var(--primary) / <alpha-value>)',
              hover: 'rgb(var(--primary-hover) / <alpha-value>)',
              fg: 'rgb(var(--primary-fg) / <alpha-value>)',
              soft: 'rgb(var(--primary-soft) / <alpha-value>)',
              'soft-fg': 'rgb(var(--primary-soft-fg) / <alpha-value>)',
            },
            success: {
              DEFAULT: 'rgb(var(--success) / <alpha-value>)',
              fg: 'rgb(var(--success-fg) / <alpha-value>)',
              soft: 'rgb(var(--success-soft) / <alpha-value>)',
              'soft-fg': 'rgb(var(--success-soft-fg) / <alpha-value>)',
            },
            warning: {
              DEFAULT: 'rgb(var(--warning) / <alpha-value>)',
              fg: 'rgb(var(--warning-fg) / <alpha-value>)',
              soft: 'rgb(var(--warning-soft) / <alpha-value>)',
              'soft-fg': 'rgb(var(--warning-soft-fg) / <alpha-value>)',
            },
            danger: {
              DEFAULT: 'rgb(var(--danger) / <alpha-value>)',
              hover: 'rgb(var(--danger-hover) / <alpha-value>)',
              fg: 'rgb(var(--danger-fg) / <alpha-value>)',
              soft: 'rgb(var(--danger-soft) / <alpha-value>)',
              'soft-fg': 'rgb(var(--danger-soft-fg) / <alpha-value>)',
            },

            /* ---- chat de WhatsApp (solo la bandeja y el modo movil) ----
               Paleta propia y aparte de la del ERP: ver la nota de los
               tokens --wa-* mas arriba.                                 */
            wa: {
              bg: 'rgb(var(--wa-bg) / <alpha-value>)',
              panel: 'rgb(var(--wa-panel) / <alpha-value>)',
              header: 'rgb(var(--wa-header) / <alpha-value>)',
              in: 'rgb(var(--wa-in) / <alpha-value>)',
              out: 'rgb(var(--wa-out) / <alpha-value>)',
              text: 'rgb(var(--wa-text) / <alpha-value>)',
              meta: 'rgb(var(--wa-meta) / <alpha-value>)',
              'meta-out': 'rgb(var(--wa-meta-out) / <alpha-value>)',
              divider: 'rgb(var(--wa-divider) / <alpha-value>)',
              hover: 'rgb(var(--wa-hover) / <alpha-value>)',
              active: 'rgb(var(--wa-active) / <alpha-value>)',
              input: 'rgb(var(--wa-input) / <alpha-value>)',
              pill: 'rgb(var(--wa-pill) / <alpha-value>)',
              'pill-text': 'rgb(var(--wa-pill-text) / <alpha-value>)',
              notice: 'rgb(var(--wa-notice) / <alpha-value>)',
              'notice-text': 'rgb(var(--wa-notice-text) / <alpha-value>)',
              accent: 'rgb(var(--wa-accent) / <alpha-value>)',
              'accent-strong': 'rgb(var(--wa-accent-strong) / <alpha-value>)',
              'accent-fg': 'rgb(var(--wa-accent-fg) / <alpha-value>)',
              tick: 'rgb(var(--wa-tick) / <alpha-value>)',
            },

            /* ---- legacy aliases, re-pointed at the same variables ----
               Kept so existing markup keeps working AND becomes theme-aware.
               Prefer the semantic names above in new code.               */
            'primary-hover': 'rgb(var(--primary-hover) / <alpha-value>)',
            'background-light': 'rgb(var(--bg) / <alpha-value>)',
            'background-dark': 'rgb(var(--bg) / <alpha-value>)',
            'surface-dark': 'rgb(var(--surface) / <alpha-value>)',
            'surface-hover': 'rgb(var(--surface-hover) / <alpha-value>)',
            'border-dark': 'rgb(var(--border) / <alpha-value>)',
            'text-secondary': 'rgb(var(--fg-muted) / <alpha-value>)',
            'dark-bg': 'rgb(var(--bg) / <alpha-value>)',
            'dark-card': 'rgb(var(--surface) / <alpha-value>)',
            'dark-input': 'rgb(var(--surface-2) / <alpha-value>)',
            'dark-border': 'rgb(var(--border) / <alpha-value>)',
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            /* JetBrains Mono: usada en todo el Catálogo y en cualquier dato
               de código (SKU, referencias). Su altura-x alta y sus formas
               abiertas la hacen legible a 13px, a diferencia de la mayoría
               de monoespaciadas. */
            mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
          },
          /*
            Escala tipográfica modular (razón ~1.2, "Minor Third" recortada).
            Cada paso lleva su interlineado y tracking calculados:
              - cuerpo a 1.5x de interlineado (legibilidad, WCAG 1.4.12)
              - títulos progresivamente más apretados (tracking negativo),
                porque a mayor tamaño el ojo percibe más espacio entre letras
            Se declaran explícitos para que todas las pantallas usen los
            mismos valores en vez de heredar los de Tailwind por defecto.
          */
          fontSize: {
            '2xs': ['0.6875rem', { lineHeight: '1rem', letterSpacing: '0.01em' }],      /* 11px etiquetas */
            'xs': ['0.75rem', { lineHeight: '1.125rem' }],                              /* 12px meta      */
            'sm': ['0.8125rem', { lineHeight: '1.25rem' }],                             /* 13px UI densa  */
            'base': ['0.875rem', { lineHeight: '1.3125rem' }],                          /* 14px cuerpo    */
            'lg': ['1rem', { lineHeight: '1.5rem', letterSpacing: '-0.006em' }],        /* 16px           */
            'xl': ['1.125rem', { lineHeight: '1.625rem', letterSpacing: '-0.012em' }],  /* 18px           */
            '2xl': ['1.375rem', { lineHeight: '1.875rem', letterSpacing: '-0.018em' }], /* 22px título    */
            '3xl': ['1.75rem', { lineHeight: '2.125rem', letterSpacing: '-0.022em' }],  /* 28px           */
            '4xl': ['2.125rem', { lineHeight: '2.5rem', letterSpacing: '-0.026em' }],   /* 34px cifra KPI */
          },
          ringColor: {
            DEFAULT: 'rgb(var(--ring) / <alpha-value>)',
          },
          /*
            Rampa de elevación serena: mucho desenfoque, poca opacidad, y
            teñida con --shadow-color en vez de negro puro. Una sombra dura
            "grita"; una difusa del mismo color del texto se integra.
            Cada paso duplica aproximadamente el desenfoque del anterior.
          */
          boxShadow: {
            'xs': '0 1px 2px 0 rgb(var(--shadow-color) / 0.03)',
            'sm': '0 1px 3px 0 rgb(var(--shadow-color) / 0.04), 0 1px 2px -1px rgb(var(--shadow-color) / 0.03)',
            DEFAULT: '0 2px 6px -1px rgb(var(--shadow-color) / 0.05), 0 1px 3px -1px rgb(var(--shadow-color) / 0.04)',
            'md': '0 4px 12px -2px rgb(var(--shadow-color) / 0.06), 0 2px 5px -2px rgb(var(--shadow-color) / 0.04)',
            'lg': '0 12px 28px -6px rgb(var(--shadow-color) / 0.08), 0 4px 10px -4px rgb(var(--shadow-color) / 0.04)',
            'xl': '0 20px 48px -12px rgb(var(--shadow-color) / 0.11), 0 6px 14px -6px rgb(var(--shadow-color) / 0.05)',
            '2xl': '0 32px 72px -16px rgb(var(--shadow-color) / 0.16)',
            'glow': '0 0 0 1px rgb(var(--primary) / 0.14), 0 4px 16px -2px rgb(var(--primary) / 0.16)',
          },
          /*
            Movimiento: 180ms con salida suave. Por debajo de 150ms el cambio
            se percibe brusco; por encima de 250ms, lento. La curva
            "ease-out" arranca rápido y frena, que es lo que se lee como
            calmado. (Anulado por prefers-reduced-motion más abajo.)
          */
          transitionDuration: {
            DEFAULT: '180ms',
          },
          transitionTimingFunction: {
            DEFAULT: 'cubic-bezier(0.32, 0.72, 0, 1)',
          },
          keyframes: {
            'fade-in': {
              from: { opacity: '0' },
              to: { opacity: '1' },
            },
            'scale-in': {
              from: { opacity: '0', transform: 'translateY(4px) scale(.985)' },
              to: { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
          },
          animation: {
            'fade-in': 'fade-in .15s ease-out',
            'scale-in': 'scale-in .18s cubic-bezier(.16,1,.3,1)',
          },
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .gradient-btn {
        background: linear-gradient(135deg, rgb(var(--primary)) 0%, rgb(var(--primary-hover)) 100%);
      }

      /* Used by the Layout main scroll area — was previously a no-op class. */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Alto real de la ventana en el teléfono. 100vh cuenta la barra de URL de
         Chrome/Safari aunque esté retraída, así que la barra inferior del modo
         móvil quedaba cortada al hacer scroll. La primera línea es el respaldo
         para navegadores sin dvh. */
      .h-dvh-screen {
        height: 100vh;
        height: 100dvh;
      }

      .min-h-dvh-screen {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Zona segura inferior: notch del iPhone y barra de gestos de Android. */
      .pb-safe {
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }

      /* Hueco para que el contenido no quede debajo de la barra de navegación
         móvil ni de la zona de gestos del sistema. */
      .pb-nav-safe {
        padding-bottom: var(--mobile-nav-h);
      }

      /* Fondo de scroll de una pantalla móvil con barra flotante propia: deja
         sitio para la barra de navegación, para su botón central y para la
         barra flotante que se apoya encima. */
      .pb-mobile-page {
        padding-bottom: calc(var(--mobile-nav-peak) + 1rem);
      }

      .pb-mobile-page-bar {
        padding-bottom: calc(var(--mobile-nav-peak) + 7rem);
      }

      /* Barra flotante de acciones: se apoya justo encima del botón central. */
      .bottom-above-nav {
        bottom: calc(var(--mobile-nav-peak) + 4px);
      }

      /* Elementos que se apilan sobre esa barra flotante. */
      .bottom-above-bar {
        bottom: calc(var(--mobile-nav-peak) + 64px);
      }

      .bottom-above-bar-2 {
        bottom: calc(var(--mobile-nav-peak) + 112px);
      }

      /* Numeric columns: fixed-width digits so decimals line up down the column. */
      .tnum {
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1, 'cv05' 1;
      }
    }
  </style>

  <style>
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* Inter's contextual alternates + straight-sided digits read better in tables */
      font-feature-settings: 'cv05' 1, 'ss03' 1;
    }

    /* A single, consistent keyboard focus ring for the whole app.
       Applies only to keyboard focus, so mouse users never see a stray ring. */
    :focus-visible {
      outline: 2px solid rgb(var(--ring));
      outline-offset: 2px;
      border-radius: 0.25rem;
    }

    /* Custom scrollbars that match the surface tokens (light + dark). */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgb(var(--border-strong)) transparent;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: rgb(var(--border-strong));
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background-color: rgb(var(--fg-subtle));
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .filled-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /*
       Medidas de la barra de navegación móvil, en un solo sitio.

       Cada pantalla las tenía a ojo (72px, 88px, 108px, 168px, 216px,
       pb-28/44/56) y ya habían divergido: Etiquetas y Proforma anclaban su
       barra flotante a 88px, por debajo del botón central de impresión, que se
       les venía encima.

       --mobile-nav-h: alto real de la barra = pt-2 (8) + ul py-2 (16) + botón
         central de 60px = 84px, más la zona segura del sistema.
       --mobile-nav-peak: hasta dónde llega ese botón central, que sobresale
         20px por encima (`-top-5`). Nada flotante puede bajar de aquí.
    */
    :root {
      --mobile-nav-h: calc(84px + env(safe-area-inset-bottom));
      --mobile-nav-peak: calc(104px + env(safe-area-inset-bottom));
    }

    /*
       Animaciones del modo móvil.

       Estaban repetidas en cuatro bloques <style> dentro de los componentes,
       con duraciones distintas para el mismo nombre (0.4s en Inicio, 0.25s en
       Inventario, 0.2s en Catálogo), y `animate-slide-down` faltaba justo en
       la pantalla de Inventario: allí el panel de sugerencias aparecía de
       golpe. Viven aquí una sola vez.
    */
    @keyframes mobile-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes mobile-slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes mobile-slide-down {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes mobile-pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50%      { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
    }

    .animate-fade-in   { animation: mobile-fade-in 0.25s ease-out forwards; }
    .animate-slide-up  { animation: mobile-slide-up 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-down{ animation: mobile-slide-down 0.25s ease-out forwards; }
    .animate-pulse-glow{ animation: mobile-pulse-glow 2s infinite; }

    /* Respect the OS "reduce motion" setting — required for accessibility. */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
